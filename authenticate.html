<head>

<style>
:root{--bg:#F6F3EE;--bg-2:#EDE8DF;--bg-3:#FFFFFF;--line:#DDD6CA;--fg:#111113;--mute:#5E5A53;--gold:#D9C38A;--gold-ink:#7A5F14;--dark:#111113;--display:'Anton',Impact,sans-serif;--body:'Inter',system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
.beri-dark{--bg:#111113;--bg-2:#17171A;--bg-3:#1E1E22;--line:#2C2C31;--fg:#F3F0E9;--mute:#B0ACA5;--gold-ink:#D9C38A;background-color:#111113;color:#F3F0E9}
.beri-pattern{position:relative;isolation:isolate;overflow:clip}
.beri-pattern::before{content:"";position:absolute;inset:-50%;z-index:-1;background-image:url("assets/blob/2cffc67c998d9d4fcfa45c0105a151bb.png"),url("assets/blob/2cffc67c998d9d4fcfa45c0105a151bb.png");background-size:220px 140px,220px 140px;background-position:0 0,110px 70px;background-repeat:repeat;transform:rotate(-24deg);opacity:.07;pointer-events:none}
html{scroll-behavior:smooth}
body{margin:0;background:#F6F3EE}
a{color:#111113}a:hover{color:#7A5F14}
.rv-ready [data-reveal]{opacity:0;transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv-ready [data-reveal="up"]{transform:translateY(56px)}
.rv-ready [data-reveal="left"]{transform:translateX(-64px)}
.rv-ready [data-reveal="right"]{transform:translateX(64px)}
.rv-ready [data-reveal="scale"]{transform:scale(.92)}
.rv-ready [data-reveal][data-in]{opacity:1;transform:none}
.beri-link{position:relative}
.beri-link::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:#D9C38A;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.beri-link:hover::after,.beri-link.is-current::after{transform:scaleX(1)}
.nav-dd{position:relative}
.nav-menu{position:absolute;top:100%;left:-24px;padding-top:18px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.nav-dd:hover .nav-menu,.nav-dd:focus-within .nav-menu{opacity:1;visibility:visible;transform:none}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;color:#111113;text-decoration:none}
.nav-item:hover{background:#F6F3EE;color:#111113}
.strip-link{transition:background .3s ease,color .3s ease;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.strip-link:hover{background:rgba(255,255,255,.2)}
.code-input:focus{outline:3px solid #D9C38A;outline-offset:2px}
@media (max-width:899px){.big-head{font-size:72px !important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv-ready [data-reveal]{opacity:1;transform:none;transition:none}}
</style>

</head>

<main id="top">

<form data-reveal="scale" onSubmit="{{verify}}" style="flex: 1 1 440px; min-width: 0; box-sizing: border-box; border-radius: 32px; background: #FFFFFF; color: #111113; padding: 40px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 40px 100px rgba(0,0,0,0.45); transition-delay: 120ms">

<button type="submit" style="height: 60px; border: none; border-radius: 999px; background: #111113; color: #F6F3EE; font: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; cursor: pointer">VERIFY CODE</button>
<sc-if value="{{checked}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: 16px; background: #F6F3EE; border: 1px solid #DDD6CA; font-size: 15px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A5F14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.5v.5"></path></svg>
<span>Checking <strong>{{shownCode}}</strong> against BERI records. [Connect to BERI’s verification system to show the real result here.]</span>
</div>
</sc-if>
<p style="margin: 0; font-size: 13px; color: #5E5A53">Can’t find the label or the code won’t scan? Contact us at [support email].</p>
</form>
</div>
</section>

<section style="max-width: 1320px; margin: 0 auto; padding: 120px 32px; display: flex; flex-direction: column; gap: 40px">
<h2 class="big-head" data-reveal="up" style="margin: 0; font-family: var(--display); font-weight: 400; font-size: 96px; line-height: 0.9; text-transform: uppercase">How it works</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px">

<section style="padding: 0 32px 140px">
<div data-reveal="scale" style="max-width: 1320px; margin: 0 auto; box-sizing: border-box; border-radius: 40px; background: #FFFFFF; border: 1px solid var(--line); padding: 64px; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.32em; color: var(--gold-ink)">STAY SAFE</span>
<h2 class="big-head" style="margin: 0; font-family: var(--display); font-weight: 400; font-size: 80px; line-height: 0.9; text-transform: uppercase">Spot a fake</h2>
<p style="margin: 0; max-width: 380px; font-size: 17px; color: var(--mute)">Counterfeits can look close to the real thing. A few quick checks before you vape.</p>
</div>
<div style="flex: 1 1 520px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{tips}}" as="t" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 22px; border-radius: 20px; background: #F6F3EE">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>

<span style="font-size: 15px; color: var(--mute)">{{t.text}}</span>

</sc-for>

<script type="text/x-dc" data-dc-script data-props='{"animations":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":2700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scrolled: false, code: '', checked: false, shownCode: '' };
  }
  componentDidMount() {
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.onScroll = () => {
      const scrolled = (window.scrollY || 0) > 24;
      if (scrolled !== this.state.scrolled) this.setState({ scrolled: scrolled });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
    this.setupReveal();
  }
  componentDidUpdate() {
    if (!this.io && this.motionOn()) this.setupReveal();
    if (this.io && !this.motionOn()) this.teardownReveal();
    this.scanReveal();
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    this.teardownReveal();
  }
  motionOn() {
    return (this.props.animations ?? true) && !this.reduce;
  }
  setupReveal() {
    if (!this.motionOn() || !('IntersectionObserver' in window)) return;
    document.documentElement.classList.add('rv-ready');
    this.io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.setAttribute('data-in', '');
          this.io.unobserve(e.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    this.scanReveal();
  }
  scanReveal() {
    if (!this.io) return;
    document.querySelectorAll('[data-reveal]:not([data-in]):not([data-rv])').forEach((el) => {
      el.setAttribute('data-rv', '');
      this.io.observe(el);
    });
  }
  teardownReveal() {
    if (this.io) this.io.disconnect();
    this.io = null;
    document.documentElement.classList.remove('rv-ready');
    document.querySelectorAll('[data-rv]').forEach((el) => el.removeAttribute('data-rv'));
  }
  renderVals() {
    const steps = [
      { n: '01', title: 'Scratch the label', text: 'Find the security label on your BERI box and gently scratch off the coating.' },
      { n: '02', title: 'Enter the code', text: 'Type the code exactly as printed into the form above.' },
      { n: '03', title: 'See the result', text: 'We check it against BERI records and tell you if the device is genuine.' }
    ];
    return {
      navStyle: 'transition: background 0.4s ease, border-color 0.4s ease, backdrop-filter 0.4s ease; ' + (this.state.scrolled
        ? 'background: rgba(246,243,238,0.72); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border-bottom: 1px solid rgba(17,17,19,0.08); box-shadow: 0 8px 30px rgba(17,17,19,0.06)'
        : 'background: rgba(246,243,238,0); border-bottom: 1px solid rgba(17,17,19,0)'),
      code: this.state.code,
      onCode: (e) => this.setState({ code: e.target.value, checked: false }),
      verify: (e) => {
        e.preventDefault();
        const c = this.state.code.trim();
        if (c) this.setState({ checked: true, shownCode: c.toUpperCase() });
      },
      checked: this.state.checked,
      shownCode: this.state.shownCode,
      steps: steps.map((s, i) => ({
        n: s.n,
        title: s.title,
        text: s.text,
        style: 'flex: 1 1 300px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 32px; border-radius: 28px; background: #FFFFFF; border: 1px solid #DDD6CA; transition-delay: ' + (i * 120) + 'ms'
      })),
      tips: [
        { title: 'Buy from trusted stores', text: 'Shop at authorized BERI retailers rather than unknown online sellers.' },
        { title: 'Check the label first', text: 'The security label should be intact and unscratched when you buy.' },
        { title: 'Look at the print', text: 'Blurry logos, typos or odd colours on the box are warning signs.' },
        { title: 'Verify every device', text: 'Run the code on every box, even from a store you have used before.' }
      ]
    };
  }
}
</script>
