<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BERI Cliq product page</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
@font-face{font-family:"GraffitiBomb Outline";src:url("assets/blob/beacc7fcc275100fd9de2ed4d2b72321.ttf") format("truetype");font-display:swap}
:root{--bg:#F6F3EE;--bg-2:#EDE8DF;--bg-3:#FFFFFF;--line:#DDD6CA;--fg:#111113;--mute:#5E5A53;--gold:#D9C38A;--gold-ink:#7A5F14;--dark:#111113;--display:'Anton',Impact,sans-serif;--display-outline:'GraffitiBomb Outline','Anton',Impact,sans-serif;--body:'Inter',system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
.beri-dark{--bg:#111113;--bg-2:#17171A;--bg-3:#1E1E22;--line:#2C2C31;--fg:#F3F0E9;--mute:#B0ACA5;--gold-ink:#D9C38A;background-color:#111113;color:#F3F0E9}
html{scroll-behavior:smooth}
body{margin:0;background:#F6F3EE}
a{color:#111113}a:hover{color:#7A5F14}
.rv-ready [data-reveal]{opacity:0;transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv-ready [data-reveal="up"]{transform:translateY(56px)}
.rv-ready [data-reveal="left"]{transform:translateX(-64px)}
.rv-ready [data-reveal="right"]{transform:translateX(64px)}
.rv-ready [data-reveal="scale"]{transform:scale(.92)}
.rv-ready [data-reveal][data-in]{opacity:1;transform:none}
@keyframes beriMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.beri-marquee{animation:beriMarquee 32s linear infinite}
@keyframes beriSlideLR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.flavor-track{animation:beriSlideLR 90s linear infinite}
.flavor-slider:hover .flavor-track{animation-play-state:paused}
@keyframes beriFloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(-6deg)}}
.p-float{animation:beriFloat 6s ease-in-out infinite}
.beri-link{position:relative}
.beri-link::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:#D9C38A;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.beri-link:hover::after,.beri-link.is-current::after{transform:scaleX(1)}
.nav-dd{position:relative}
.nav-menu{position:absolute;top:100%;left:-24px;padding-top:18px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.nav-dd:hover .nav-menu,.nav-dd:focus-within .nav-menu{opacity:1;visibility:visible;transform:none}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;color:#111113;text-decoration:none}
.nav-item:hover{background:#F6F3EE;color:#111113}
.strip-link{transition:background .3s ease,color .3s ease;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.strip-link:hover{background:rgba(255,255,255,.2)}
@media (max-width:899px){.p-logo{max-width:300px !important}.big-head{font-size:72px !important}.v-title{font-size:56px !important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv-ready [data-reveal]{opacity:1;transform:none;transition:none}.beri-marquee,.p-float,.flavor-track{animation:none}.flavor-slider{overflow-x:auto !important}}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6">

<div style="position: sticky; top: 0; z-index: 50">
<div style="background: #FFFFFF; color: #000000; text-align: center; font-weight: 700; font-size: 15px; padding: 8px 16px; line-height: 1.35; border-bottom: 1px solid #DDD6CA">WARNING: This product contains nicotine. Nicotine is an addictive chemical.</div>
<header style="{{navStyle}}">
<nav style="max-width: 1320px; margin: 0 auto; padding: 0 32px; min-height: 80px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="Beri-Premium.dc.html" aria-label="BERI home" style="display: flex; align-items: center; text-decoration: none">
<img src="assets/blob/bd8d6ee885cd447f39d73ea5ec4478b3.png" alt="BERI" style="display: block; height: 46px; width: auto">
</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 40px; font-size: 13px; font-weight: 600; letter-spacing: 0.22em">
<a class="beri-link" href="Beri-Premium.dc.html" style="color: var(--fg); text-decoration: none">HOME</a>
<div class="nav-dd">
<button type="button" class="beri-link is-current" aria-haspopup="true" style="display: inline-flex; align-items: center; gap: 6px; padding: 0; border: none; background: none; font: inherit; letter-spacing: inherit; color: var(--fg); cursor: pointer">PRODUCTS<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<div class="nav-menu">
<div style="min-width: 240px; padding: 10px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DDD6CA; box-shadow: 0 20px 50px rgba(17,17,19,0.14); display: flex; flex-direction: column; gap: 2px; letter-spacing: 0.16em">
<a class="nav-item" href="Cliq.dc.html"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: #0F7A42"></span>BERI CLIQ</a>
<a class="nav-item" href="Crush.dc.html"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: #C81E64"></span>BERI CRUSH</a>
<a class="nav-item" href="Cirql.dc.html"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: #7A1626"></span>BERI CIRQL</a>
</div>
</div>
</div>
<a class="beri-link" href="Authenticate.dc.html" style="color: var(--fg); text-decoration: none">AUTHENTICATE</a>
<a class="beri-link" href="Wholesale.dc.html" style="color: var(--fg); text-decoration: none">WHOLESALE</a>
</div>
</nav>
</header>
</div>

<main id="top">
<sc-if value="{{p.hasVideo}}" hint-placeholder-val="{{false}}">
<section id="video-hero" aria-label="BERI {{p.name}} reveal" style="{{vTrackStyle}}">
<div style="{{vStageStyle}}">
<video id="product-video" src="{{p.video}}" poster="{{p.poster}}" aria-label="BERI {{p.name}} product reveal" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000000"></video>
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.3) 42%, rgba(0,0,0,0) 68%)"></div>
<sc-for list="{{chapters}}" as="ch" hint-placeholder-count="1">
<div style="{{ch.style}}">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.32em; color: #7FE7F0">{{ch.eyebrow}}</span>
<span class="v-title" style="font-family: var(--display); font-size: 96px; line-height: 0.9; text-transform: uppercase; color: #FFFFFF">{{ch.title}}</span>
<span style="font-size: 18px; color: rgba(255,255,255,0.86)">{{ch.text}}</span>
</div>
</sc-for>
<div style="{{vCtaStyle}}">
<a href="#specs" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px; background: #FFFFFF; color: #111113; font-weight: 700; text-decoration: none">See specs</a>
<a href="#flavors" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.6); color: #FFFFFF; font-weight: 600; text-decoration: none">All flavors</a>
</div>
<div aria-hidden="true" style="{{vHintStyle}}">
<span>SCROLL TO REVEAL</span>
<span style="display: block; width: 2px; height: 40px; background: #FFFFFF; opacity: 0.5"></span>
</div>
<div aria-hidden="true" style="position: absolute; z-index: 3; left: 32px; right: 32px; bottom: 116px; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.18)">
<div style="{{vBarStyle}}"></div>
</div>
</div>
</section>
</sc-if>
<section id="reveal-hero" style="{{rTrackStyle}}">
<div style="{{heroStyle}}">
<div style="width: 100%; max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<nav aria-label="Breadcrumb" data-reveal="up" style="font-size: 13px; font-weight: 600; letter-spacing: 0.16em; color: var(--mute)">
<a href="Beri-Premium.dc.html" style="color: var(--mute); text-decoration: none">HOME</a> / PRODUCTS / <span style="color: var(--fg)">BERI {{p.name}}</span>
</nav>
<span data-reveal="up" style="{{badgeStyle}}">{{p.badge}}</span>
<h1 data-reveal="up" style="margin: 0; transition-delay: 80ms">
<img class="p-logo" src="{{p.logo}}" alt="BERI {{p.name}}" style="{{logoStyle}}">
</h1>
<p data-reveal="up" style="margin: 0; max-width: 520px; font-size: 20px; color: var(--mute); transition-delay: 140ms">{{p.tagline}}</p>
<div data-reveal="up" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 620px; padding-top: 8px; transition-delay: 200ms">
<sc-for list="{{p.highlights}}" as="h" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; padding-top: 14px; border-top: 2px solid var(--fg)">
<span style="font-family: var(--display); font-size: 30px; line-height: 1.1">{{h.value}}</span>
<span style="font-size: 13px; color: var(--mute)">{{h.label}}</span>
</div>
</sc-for>
</div>
<div data-reveal="up" style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 10px; transition-delay: 260ms">
<a href="Wholesale.dc.html" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 30px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 700; letter-spacing: 0.06em; text-decoration: none">WHOLESALE INQUIRY →</a>
<a href="Authenticate.dc.html" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; border-radius: 999px; border: 1.5px solid var(--fg); color: var(--fg); font-weight: 600; text-decoration: none">Verify authenticity</a>
</div>
</div>
<div data-reveal="scale" style="flex: 1 1 420px; min-width: 0; min-height: 620px; position: relative; display: flex; align-items: center; justify-content: center; transition-delay: 120ms">
<div aria-hidden="true" style="{{glowStyle}}"></div>
<sc-if value="{{p.noReveal}}" hint-placeholder-val="{{true}}">
<img class="p-float" src="{{p.img}}" alt="{{p.imgAlt}}" style="{{imgStyle}}">
</sc-if>
<sc-if value="{{p.hasReveal}}" hint-placeholder-val="{{false}}">
<sc-for list="{{revealDevices}}" as="rd" hint-placeholder-count="3">
<img src="{{rd.img}}" alt="{{rd.alt}}" style="{{rd.style}}">
</sc-for>
<sc-for list="{{revealNames}}" as="rn" hint-placeholder-count="3">
<span aria-hidden="true" style="{{rn.style}}">{{rn.name}}</span>
</sc-for>
</sc-if>
</div>
</div>
</div>
</section>

<div class="beri-dark" aria-hidden="true" style="overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg-2); padding: 22px 0">
<div class="beri-marquee" style="display: flex; width: max-content; gap: 56px; font-family: var(--display-outline); font-size: 34px; letter-spacing: -0.126em; text-transform: uppercase; white-space: nowrap; color: var(--fg)">
<sc-for list="{{marquee}}" as="m" hint-placeholder-count="10">
<span>{{m.t}}</span><span style="color: var(--gold-ink)">✦</span>
</sc-for>
</div>
</div>

<section id="specs" style="scroll-margin-top: 120px; max-width: 1320px; margin: 0 auto; padding: 120px 32px; display: flex; flex-wrap: wrap; gap: 64px; align-items: flex-start">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<span data-reveal="left" style="font-size: 13px; font-weight: 600; letter-spacing: 0.32em; color: var(--gold-ink)">SPECIFICATIONS</span>
<h2 class="big-head" data-reveal="left" style="margin: 0; font-family: var(--display); font-weight: 400; font-size: 96px; line-height: 0.9; text-transform: uppercase; transition-delay: 80ms">Inside<br>BERI {{p.name}}</h2>
<p data-reveal="left" style="margin: 0; max-width: 420px; font-size: 18px; color: var(--mute); transition-delay: 160ms">{{p.summary}}</p>
</div>
<div data-reveal="right" style="flex: 1 1 560px; min-width: 0; border-radius: 28px; background: #FFFFFF; border: 1px solid var(--line); padding: 12px 32px">
<sc-for list="{{p.specs}}" as="s" hint-placeholder-count="8">
<div style="{{s.rowStyle}}">
<span style="color: var(--mute)">{{s.k}}</span>
<span style="font-weight: 600; text-align: right">{{s.v}}</span>
</div>
</sc-for>
</div>
</section>

<sc-if value="{{p.hasBanners}}" hint-placeholder-val="{{true}}">
<section aria-label="Features" style="max-width: 1320px; margin: 0 auto; padding: 0 32px 120px; display: flex; flex-direction: column; gap: 24px">
<img data-reveal="scale" src="assets/blob/0a2532abcfdd671f02c321ad6f8258e5.webp" alt="BERI Crush: up to 40W power" style="display: block; width: 100%; height: auto; aspect-ratio: 4 / 1; object-fit: cover; border-radius: 28px">
<img data-reveal="scale" src="assets/blob/a42def607ce5692f865909dfe469729b.webp" alt="Quad coil technology" style="display: block; width: 100%; height: auto; aspect-ratio: 4 / 1; object-fit: cover; border-radius: 28px">
<img data-reveal="scale" src="assets/blob/2398eaa60b655afe7043664d983da37d.webp" alt="Interactive HD screen" style="display: block; width: 100%; height: auto; aspect-ratio: 4 / 1; object-fit: cover; border-radius: 28px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; padding-top: 24px">
<img data-reveal="up" src="assets/blob/14137e017345c2dd41913f3d5bb3e181.png" alt="40 watt super power" style="display: block; flex: 1 1 300px; min-width: 0; height: auto; aspect-ratio: 5 / 2; object-fit: contain">
<img data-reveal="up" src="assets/blob/59e8e82f49c41f1c896d36885758acde.png" alt="World 1st auto-adaptive power" style="display: block; flex: 1 1 300px; min-width: 0; height: auto; aspect-ratio: 5 / 2; object-fit: contain; transition-delay: 100ms">
<img data-reveal="up" src="assets/blob/c290186ca08ad6b8a291264e55e8811c.png" alt="Adjustable airflow" style="display: block; flex: 1 1 300px; min-width: 0; height: auto; aspect-ratio: 5 / 2; object-fit: contain; transition-delay: 200ms">
<img data-reveal="up" src="assets/blob/cf6ecc4bf4dd121a83f9020b207d801a.png" alt="2.5x charging speed" style="display: block; flex: 1 1 300px; min-width: 0; height: auto; aspect-ratio: 5 / 2; object-fit: contain">
<img data-reveal="up" src="assets/blob/3792cab5944670d3faf0d75c9fcb2203.png" alt="Quad coil technology" style="display: block; flex: 1 1 300px; min-width: 0; height: auto; aspect-ratio: 5 / 2; object-fit: contain; transition-delay: 100ms">
<img data-reveal="up" src="assets/blob/364e1253c927fdd746bc0975fe8357c3.png" alt="Interactive HD screen" style="display: block; flex: 1 1 300px; min-width: 0; height: auto; aspect-ratio: 5 / 2; object-fit: contain; transition-delay: 200ms">
</div>
</section>
</sc-if>

<sc-if value="{{p.hasSpecBanner}}" hint-placeholder-val="{{false}}">
<section aria-label="BERI {{p.name}} features" style="max-width: 1320px; margin: 0 auto; padding: 0 32px 120px">
<img data-reveal="scale" src="{{p.specBanner}}" alt="{{p.specBannerAlt}}" style="display: block; width: 100%; height: auto; border-radius: 28px; box-shadow: 0 30px 70px rgba(17,17,19,0.18)">
</section>
</sc-if>

<section id="flavors" class="beri-dark" style="scroll-margin-top: 120px">
<div style="max-width: 1320px; margin: 0 auto; padding: 120px 32px; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
<h2 class="big-head" data-reveal="up" style="margin: 0; font-family: var(--display); font-weight: 400; font-size: 120px; line-height: 0.9; text-transform: uppercase">Flavors</h2>
<div data-reveal="up" style="display: flex; align-items: baseline; gap: 12px; transition-delay: 120ms">
<span style="{{countStyle}}">{{p.flavorCount}}</span>
<span style="font-size: 18px; color: var(--mute)">flavors in BERI {{p.name}}</span>
</div>
</div>
<sc-if value="{{p.hasFlavorBanner}}" hint-placeholder-val="{{false}}">
<div data-reveal="scale" style="overflow-x: auto; border-radius: 24px">
<img src="{{p.flavorBanner}}" alt="{{p.flavorBannerAlt}}" style="display: block; width: 100%; min-width: 900px; height: auto">
</div>
</sc-if>
<sc-if value="{{p.hasSlider}}" hint-placeholder-val="{{false}}">
<div class="flavor-slider" role="region" aria-label="BERI {{p.name}} flavors" style="position: relative; overflow: hidden; margin: 0 -32px; padding: 8px 0">
<div class="flavor-track" style="display: flex; width: max-content; gap: 20px">
<sc-for list="{{slides}}" as="sl" hint-placeholder-count="12">
<figure style="{{sl.style}}">
<img src="{{sl.img}}" alt="{{sl.alt}}" style="display: block; width: 100%; height: auto; aspect-ratio: 4 / 7; object-fit: cover; border-radius: 16px">
<figcaption style="font-family: var(--display); font-size: 22px; line-height: 1.1; text-transform: uppercase; text-align: center; color: #111113">{{sl.name}}</figcaption>
</figure>
</sc-for>
</div>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{p.flavorItems}}" as="fl" hint-placeholder-count="16">
<span data-reveal="scale" style="{{fl.style}}">{{fl.f}}</span>
</sc-for>
</div>
</div>
</section>

<sc-if value="{{p.hasPackBanner}}" hint-placeholder-val="{{false}}">
<section aria-label="BERI {{p.name}} retail displays" style="max-width: 1320px; margin: 0 auto; padding: 120px 32px 0; display: flex; flex-direction: column; gap: 24px">
<img data-reveal="scale" src="{{p.packBanner}}" alt="{{p.packBannerAlt}}" style="display: block; width: 100%; height: auto; border-radius: 28px">
<div data-reveal="up" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<p style="margin: 0; max-width: 620px; font-size: 18px; color: var(--mute)">{{p.packText}}</p>
<a href="Wholesale.dc.html" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 30px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 700; letter-spacing: 0.06em; text-decoration: none">ORDER 5-PACK DISPLAYS →</a>
</div>
</section>
</sc-if>

<section style="max-width: 1320px; margin: 0 auto; padding: 120px 32px 140px; display: flex; flex-direction: column; gap: 40px">
<h2 class="big-head" data-reveal="up" style="margin: 0; font-family: var(--display); font-weight: 400; font-size: 96px; line-height: 0.9; text-transform: uppercase">Explore the lineup</h2>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<sc-for list="{{others}}" as="o" hint-placeholder-count="2">
<a data-reveal="up" href="{{o.href}}" style="{{o.style}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.28em">BERI</span>
<span style="font-family: var(--display); font-size: 72px; line-height: 0.9">{{o.name}}</span>
<span style="max-width: 300px; font-size: 15px; color: rgba(255,255,255,0.9)">{{o.tagline}}</span>
<span style="margin-top: 12px; align-self: flex-start; display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #FFFFFF; color: {{o.color}}; font-size: 15px; font-weight: 700">View BERI {{o.name}} →</span>
</div>
<img src="{{o.img}}" alt="{{o.imgAlt}}" style="display: block; height: 260px; width: auto; max-width: 45%; object-fit: contain; filter: drop-shadow(0 24px 36px rgba(0,0,0,0.35))">
</a>
</sc-for>
</div>
</section>
</main>

<footer class="beri-dark" style="border-top: 1px solid var(--line)">
<div style="max-width: 1320px; margin: 0 auto; padding: 56px 32px 140px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<img src="assets/blob/bd8d6ee885cd447f39d73ea5ec4478b3.png" alt="BERI" style="display: block; height: 80px; width: auto">
<div style="display: flex; flex-wrap: wrap; gap: 32px; font-size: 13px; font-weight: 600; letter-spacing: 0.22em">
<a class="beri-link" href="Beri-Premium.dc.html" style="color: var(--fg); text-decoration: none">HOME</a>
<a class="beri-link" href="Cliq.dc.html" style="color: var(--fg); text-decoration: none">BERI CLIQ</a>
<a class="beri-link" href="Crush.dc.html" style="color: var(--fg); text-decoration: none">BERI CRUSH</a>
<a class="beri-link" href="Cirql.dc.html" style="color: var(--fg); text-decoration: none">BERI CIRQL</a>
<a class="beri-link" href="Authenticate.dc.html" style="color: var(--fg); text-decoration: none">AUTHENTICATE</a>
<a class="beri-link" href="Wholesale.dc.html" style="color: var(--fg); text-decoration: none">WHOLESALE</a>
</div>
</div>
<a href="mailto:wholesale@beridisposable.com" style="align-self: flex-start; color: var(--fg); font-weight: 600">wholesale@beridisposable.com</a>
<p style="margin: 0; font-size: 14px; color: var(--mute)">Sale of these products is restricted to adults 21 and over. WARNING: This product contains nicotine. Nicotine is an addictive chemical.</p>
<p style="margin: 0; font-size: 14px; color: var(--mute)">Copyright © 2025 BERIdisposable.com – All Rights Reserved.</p>

          style: 'flex: 0 0 auto; width: 220px; margin: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 10px 18px; border-radius: 24px; background: #F5F5F5; border-top: 5px solid ' + f.color
        }));
      })(),
      rTrackStyle: 'position: relative; height: ' + (rPinned ? '2800px' : 'auto'),
      revealDevices: revealDevices,
      revealNames: revealNames,
      p: Object.assign({}, base, {
        hasReveal: hasReveal,
        hasSlider: !!(base.slider && base.slider.length),
        hasSpecBanner: !!base.specBanner,
        specBanner: base.specBanner || '',
        specBannerAlt: base.specBannerAlt || '',
        hasFlavorBanner: !!base.flavorBanner,
        flavorBanner: base.flavorBanner || '',
        flavorBannerAlt: base.flavorBannerAlt || '',
        hasPackBanner: !!base.packBanner,
        packBanner: base.packBanner || '',
        packBannerAlt: base.packBannerAlt || '',
        packText: base.packText || '',
        noReveal: !hasReveal,
        hasVideo: hasVideo,
        video: base.video || '',
        poster: base.poster || '',
        flavorCount: base.flavorTotal || (PRODUCT_KEY === 'CIRQL' ? '[COUNT]' : String(base.flavors.length)),
        flavorItems: base.flavors.map((f, i) => ({
          f: f,
          style: 'display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #1E1E22; border: 1px solid #2C2C31; font-size: 16px; font-weight: 500; color: #F3F0E9; transition-delay: ' + Math.min(i * 30, 600) + 'ms'
        })),
        specs: base.specs.map((s, i) => ({
          k: s.k,
          v: s.v,
          rowStyle: 'display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; padding: 18px 0; font-size: 16px; ' + (i < base.specs.length - 1 ? 'border-bottom: 1px solid #DDD6CA' : '')
        }))
      }),
      heroStyle: rPinned
        ? 'position: sticky; top: 0; height: 100vh; min-height: 720px; box-sizing: border-box; display: flex; align-items: center; overflow: hidden; padding: 120px 32px 110px; background: ' + revealBg
        : 'position: relative; overflow: hidden; ' + (hasVideo ? 'padding: 110px 32px 90px; ' : 'margin-top: -80px; padding: 150px 32px 90px; ') + 'background: ' + (hasReveal ? revealBg : base.tint),
      badgeStyle: 'align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.24em; color: #FFFFFF; background: ' + base.color + '; padding: 8px 14px; border-radius: 999px',
      logoStyle: 'display: block; width: 100%; max-width: ' + base.logoW + 'px; height: auto',
      glowStyle: 'position: absolute; width: 560px; height: 560px; border-radius: 999px; background: radial-gradient(closest-side, ' + base.soft + '88, ' + base.soft + '00)',
      imgStyle: 'position: relative; display: block; height: ' + base.heroH + 'px; width: auto; max-width: 100%; object-fit: contain; filter: drop-shadow(0 40px 50px rgba(17,17,19,0.28))',
      countStyle: 'font-family: var(--display); font-size: 64px; line-height: 1; color: ' + base.soft,
      marquee: base.marquee.concat(base.marquee).map((t) => ({ t: t })),
      others: order.filter((k) => k !== PRODUCT_KEY).map((k) => {
        const o = products[k];
        return {
          name: o.name,
          href: o.page,
          color: o.color,
          img: o.img,
          imgAlt: o.imgAlt,
          tagline: o.tagline,
          style: 'flex: 1 1 480px; min-width: 0; min-height: 340px; box-sizing: border-box; border-radius: 32px; background: ' + o.color + '; color: #FFFFFF; padding: 36px; display: flex; align-items: center; justify-content: space-between; gap: 20px; overflow: hidden; text-decoration: none'
        };
      }),
      strip: order.map((k) => {
        const o = products[k];
        const current = k === PRODUCT_KEY;
        return {
          label: 'Beri ' + title(o.name),
          href: o.page,
          current: current ? 'page' : 'false',
          style: 'flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 56px; padding: 0 34px; border-radius: 999px; font-size: 17px; font-weight: 700; white-space: nowrap; text-decoration: none; ' + (current ? 'background: #FFFFFF; color: ' + o.color : 'color: #FFFFFF')
        };
      })
    };
  }
}
</script>
<script src="assets/js/beri-runtime.js"></script>
</body>
</html>
