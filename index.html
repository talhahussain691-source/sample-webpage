<html lang="en">
<head>
<meta charset="utf-8">
<title>BERI premium website</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
@font-face{font-family:"GraffitiBomb Fill";src:url("assets/blob/8da92d24c4f602d89a83527e9f6ea0e2.ttf") format("truetype");font-display:swap}
@font-face{font-family:"GraffitiBomb Solid";src:url("assets/blob/74be9bd60fbff0c176807f079bc5bdcd.ttf") format("truetype");font-display:swap}
@font-face{font-family:"GraffitiBomb Outline";src:url("assets/blob/beacc7fcc275100fd9de2ed4d2b72321.ttf") format("truetype");font-display:swap}
.beri-tag{color:#FFFFFF;text-shadow:.035em 0 0 #111113,-.035em 0 0 #111113,0 .035em 0 #111113,0 -.035em 0 #111113,.025em .025em 0 #111113,-.025em .025em 0 #111113,.025em -.025em 0 #111113,-.025em -.025em 0 #111113,.07em .09em 0 #111113}
:root{--bg:#F6F3EE;--bg-2:#EDE8DF;--bg-3:#FFFFFF;--line:#DDD6CA;--fg:#111113;--mute:#5E5A53;--gold:#D9C38A;--gold-ink:#7A5F14;--dark:#111113;--crush:#C81E64;--cliq:#0F7A42;--cirql:#4338CA;--display:'Anton',Impact,sans-serif;--display-solid:'GraffitiBomb Solid','Anton',Impact,sans-serif;--display-outline:'GraffitiBomb Outline','Anton',Impact,sans-serif;--body:'Inter',system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
.beri-pattern{position:relative;isolation:isolate;overflow:clip}
@media (max-width:899px){.hero-sub{display:none}.hero-logo{max-width:240px !important}.hero-tag{font-size:30px !important}}
.beri-pattern::before{content:"";position:absolute;inset:-50%;z-index:-1;background-image:url("assets/blob/2cffc67c998d9d4fcfa45c0105a151bb.png"),url("assets/blob/2cffc67c998d9d4fcfa45c0105a151bb.png");background-size:220px 140px,220px 140px;background-position:0 0,110px 70px;background-repeat:repeat;transform:rotate(-24deg);opacity:.07;pointer-events:none}
.beri-dark{--bg:#111113;--bg-2:#17171A;--bg-3:#1E1E22;--line:#2C2C31;--fg:#F3F0E9;--mute:#B0ACA5;--gold-ink:#D9C38A;background-color:#111113;color:#F3F0E9}
html{scroll-behavior:smooth}
body{margin:0;background:#F6F3EE}
a{color:#111113}a:hover{color:#7A5F14}
.rv-ready [data-reveal]{opacity:0;transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv-ready [data-reveal="up"]{transform:translateY(56px)}
.rv-ready [data-reveal="left"]{transform:translateX(-64px)}
.rv-ready [data-reveal="right"]{transform:translateX(64px)}
.rv-ready [data-reveal="scale"]{transform:scale(.92)}
.rv-ready [data-reveal][data-in]{opacity:1;transform:none}
@keyframes beriMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.beri-marquee{animation:beriMarquee 32s linear infinite}
.beri-link{position:relative}
.beri-link::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:#D9C38A;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.beri-link:hover::after,.beri-link.is-current::after{transform:scaleX(1)}
.nav-dd{position:relative}
.nav-menu{position:absolute;top:100%;left:-24px;padding-top:18px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.nav-dd:hover .nav-menu,.nav-dd:focus-within .nav-menu{opacity:1;visibility:visible;transform:none}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;color:#111113;text-decoration:none}
.nav-item:hover{background:#F6F3EE;color:#111113}
.strip-link{transition:background .3s ease,color .3s ease;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.strip-link:hover{background:rgba(255,255,255,.2)}
.lu-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px}
.lu-grid .lu-card.lu-card{transition:opacity .9s var(--ease),transform .5s var(--ease),box-shadow .5s var(--ease)}
.lu-grid .lu-card.lu-card:hover{transform:translateY(-6px);box-shadow:0 40px 80px rgba(17,17,19,.22)}
.lu-card{position:relative;overflow:hidden;isolation:isolate;box-sizing:border-box;border-radius:36px;color:#FFFFFF;display:flex}
.lu-feature{grid-row:span 2;flex-direction:column;min-height:760px;padding:36px}
.lu-side{flex-direction:row;align-items:stretch;gap:16px;min-height:368px;padding:32px}
.lu-img{display:block;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 30px 40px rgba(0,0,0,.4));transition:transform .7s var(--ease)}
.lu-dev{transform:translateX(var(--x,0px)) rotate(var(--r,0deg))}
.lu-card:hover .lu-dev{transform:translateX(calc(var(--x,0px) * 2)) translateY(-12px) rotate(calc(var(--r,0deg) * 1.5))}
.lu-cta{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;font-size:15px;font-weight:700;text-decoration:none;transition:background .3s ease}
.lu-ghost{border:1.5px solid rgba(255,255,255,.55);color:#FFFFFF !important}
.lu-ghost:hover{background:rgba(255,255,255,.14)}
@media (max-width:899px){.lu-grid{grid-template-columns:minmax(0,1fr)}.lu-feature{grid-row:auto;min-height:0}.lu-side{flex-direction:column}}
@keyframes beriSlideLR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.flavor-track{animation:beriSlideLR 90s linear infinite}
.flavor-slider:hover .flavor-track{animation-play-state:paused}
.tb-card{transition:transform .4s var(--ease)}
.tb-card:hover{transform:translateY(-4px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv-ready [data-reveal]{opacity:1;transform:none;transition:none}.beri-marquee{animation:none}.flavor-track{animation:none}.flavor-slider{overflow-x:auto !important}.lu-img,.lu-grid .lu-card.lu-card{transition:none}}
</style>

</head>

<span>Up to 50,000 puffs</span><span style="color: var(--gold-ink)">✦</span><span>40W Crush Mode</span><span style="color: var(--gold-ink)">✦</span><span>Quad-mesh coil</span><span style="color: var(--gold-ink)">✦</span><span>360° crystal tank</span><span style="color: var(--gold-ink)">✦</span><span>Type-C fast charging</span><span style="color: var(--gold-ink)">✦</span>

        : 'background: rgba(246,243,238,0); border-bottom: 1px solid rgba(17,17,19,0)'),
      heroTrackStyle: 'position: relative; margin-top: -80px; height: ' + (pinned ? '3000px' : 'auto'),
      heroStageStyle: (pinned ? 'position: sticky; top: 0; height: 100vh; ' : 'position: relative; height: 900px; ') + 'min-height: 720px; overflow: hidden',
      patternStyle: 'position: absolute; z-index: 0; left: 0; right: 0; top: -10%; height: 160%; background-image: url("assets/blob/2cffc67c998d9d4fcfa45c0105a151bb.png"); background-size: 220px 140px; background-repeat: repeat; opacity: 0.05; pointer-events: none; transform: translateY(' + (-180 * p) + 'px)',
      glowStyle: 'position: absolute; z-index: 0; left: 50%; top: 50%; width: 1100px; height: 1100px; border-radius: 999px; background: radial-gradient(closest-side, rgba(217,195,138,0.5), rgba(217,195,138,0)); transform: translate(-50%, -50%) translate(' + lerp(mobile ? 0 : 300, 0, t) * k + 'px, ' + lerp(0, stageH * 0.3, t) + 'px) scale(' + lerp(0.8, 1.3, t) + ')',
      bigWordStyle: 'position: absolute; z-index: 1; left: 50%; top: ' + (mobile ? '30%' : '32%') + '; font-family: var(--display); font-size: ' + Math.round(vw * (mobile ? 0.17 : 0.15)) + 'px; line-height: 1; white-space: nowrap; color: var(--fg); pointer-events: none; opacity: ' + wordIn + '; transform: translate(-50%, -50%) translateY(' + (120 * (1 - wordIn)) + 'px) scale(' + lerp(0.9, 1, wordIn) + ')',
      bubbles: bubbleSpec.map((b) => ({
        style: 'position: absolute; left: ' + b[0] + '%; top: ' + b[1] + '%; width: ' + b[2] + 'px; height: ' + b[2] + 'px; border-radius: 999px; background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.95), ' + b[3] + ' 62%); box-shadow: 0 8px 18px rgba(17,17,19,0.12); opacity: 0.8; filter: blur(' + b[5] + 'px); transform: translateY(' + (-b[4] * p) + 'px)'
      })),
      copyStyle: 'position: absolute; z-index: 3; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; ' + (mobile ? 'left: 20px; right: 20px; top: 130px; ' : 'left: ' + contentLeft + 'px; top: 50%; width: ' + Math.round(Math.min(520, vw * 0.42)) + 'px; margin-top: -250px; ') + 'opacity: ' + (1 - copyOut) + '; transform: translateY(' + (-70 * copyOut) + 'px); pointer-events: ' + (copyOut > 0.5 ? 'none' : 'auto'),
      hintStyle: 'position: absolute; z-index: 3; left: 50%; bottom: 110px; transform: translateX(-50%); display: ' + (pinned ? 'flex' : 'none') + '; flex-direction: column; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.32em; color: var(--mute); opacity: ' + clamp01(1 - p * 5),
      heroDevices: products.map((d) => {
        const f = heroFrames[d.name];
        const x = lerp(f[0][0], f[1][0], t) * (mobile ? 1 : k);
        const yy = lerp(f[0][1], f[1][1], t) + arc[d.name] * lift;
        const r = lerp(f[0][2], f[1][2], t);
        const s = lerp(f[0][3], f[1][3], t);
        return {
          name: d.name,
          img: d.img,
          alt: d.imgAlt,
          style: 'position: absolute; z-index: ' + f[0][4] + '; left: 50%; top: 50%; margin: 0; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%) translate(' + x + 'px, ' + yy + 'px) rotate(' + r + 'deg) scale(' + s + '); will-change: transform',
          imgStyle: 'display: block; height: ' + Math.round(d.heroH * sizeK) + 'px; width: auto; filter: drop-shadow(0 34px 44px rgba(17,17,19,0.3))',
          // The name sits above each device top; sizes divide by the scale so the label stays the same size.
          capStyle: 'position: absolute; bottom: 100%; left: 50%; margin-bottom: ' + (16 / s).toFixed(1) + 'px; display: flex; align-items: center; gap: ' + (10 / s).toFixed(1) + 'px; white-space: nowrap; font-family: var(--display); font-size: ' + ((mobile ? 16 : 26) / s).toFixed(1) + 'px; letter-spacing: 0.02em; color: var(--fg); opacity: ' + labelsIn + '; transform: translateX(-50%) translateY(' + (12 * (1 - labelsIn)) + 'px)',
          dotStyle: 'display: inline-block; width: ' + (12 / s).toFixed(1) + 'px; height: ' + (12 / s).toFixed(1) + 'px; border-radius: 999px; background: ' + d.color
        };
      }),
      // Lineup: the first product is the tall feature card, the other two sit beside it.
      cards: products.map((p, i) => {
        const feature = i === 0;
        const href = p.name.charAt(0) + p.name.slice(1).toLowerCase() + '.dc.html';
        // [back height, front height, overlap] for the three-device fan.
        const fan = feature ? [300, 380, 60] : (p.name === 'CIRQL' ? [270, 320, 10] : [190, 230, 50]);
        return {
          name: p.name,
          devices: p.devices.map((d, j) => ({
            img: d.img,
            alt: d.alt,
            style: 'position: relative; z-index: ' + (j === 1 ? 3 : 1) + '; height: ' + (j === 1 ? fan[1] : fan[0]) + 'px; margin: 0 ' + (j === 0 ? -fan[2] : 0) + 'px 0 ' + (j === 2 ? -fan[2] : 0) + 'px; --r: ' + [-12, 0, 12][j] + 'deg; --x: ' + [-10, 0, 10][j] + 'px'
          })),
          badge: p.badge,
          tagline: p.tagline,
          stats: p.stats,
          index: '0' + (i + 1),
          anchor: 'product-' + p.name.toLowerCase(),
          href: href,
          flavorHref: href + '#flavors',
          flavorLabel: p.flavorLabel,
          color: p.color,
          cls: 'lu-card ' + (feature ? 'lu-feature' : 'lu-side'),
          style: 'scroll-margin-top: 140px; background: ' + p.gradient,
          wordStyle: 'position: absolute; z-index: -1; font-family: var(--display); line-height: 0.8; white-space: nowrap; color: #FFFFFF; opacity: 0.1; pointer-events: none; ' + (feature ? 'right: -24px; top: 12px; font-size: 340px' : 'left: -12px; bottom: -36px; font-size: 230px'),
          mediaStyle: feature
            ? 'position: relative; flex: 1 1 auto; display: flex; align-items: flex-end; justify-content: center; min-height: 400px; padding: 8px 0 28px'
            : 'position: relative; order: 2; flex: 0 0 46%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px',
          nameStyle: 'margin: 0; font-family: var(--display); font-weight: 400; line-height: 0.88; font-size: ' + (feature ? 120 : 80) + 'px'
        };
      }),
      slides: (() => {
        const row = flavorSlider.concat(flavorSlider);
        return row.map((f) => ({
          name: f.name, img: f.img, alt: 'BERI Cliq in ' + f.name,
          style: 'flex: 0 0 auto; width: 220px; margin: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 10px 18px; border-radius: 24px; background: #F5F5F5; border-top: 5px solid ' + f.color
        }));
      })(),
      techBanners: techBanners.map((b, i) => ({
        name: b.name,
        href: b.name.charAt(0) + b.name.slice(1).toLowerCase() + '.dc.html',
        img: b.img,
        alt: b.alt,
        dotStyle: 'display: inline-block; width: 12px; height: 12px; border-radius: 999px; background: ' + b.color,
        // Cards stick one after another under the header so they stack while scrolling.
        style: 'position: sticky; top: ' + (140 + i * 28) + 'px; display: block; box-sizing: border-box; padding: 16px; border-radius: 34px; background: #17171A; border: 1px solid #2C2C31; box-shadow: 0 -24px 50px rgba(0,0,0,0.45); text-decoration: none'
      })),
      tech: [
        { big: '50K', title: 'Up to 50,000 puffs', text: 'Crush and Cliq both run up to 50,000 puffs. Cliq Mode gives up to 25,000 at higher output.' },
        { big: '40W', title: 'Crush Mode', text: 'One switch on Crush kicks power up to 40W for a more intense hit.' },
        { big: '1.77"', title: 'HD display', text: 'Crush shows battery and e-liquid levels on a 1.77 inch HD screen.' },
        { big: '360°', title: 'Crystal tank', text: 'Cliq’s transparent tank and refillable pod system let you see every drop.' },
        { big: 'MESH', title: 'Quad and dual mesh coils', text: 'Quad-coil mesh on Crush, dual mesh on Cliq, for even heating and full flavor.' },
        { big: 'USB-C', title: 'Fast Type-C charging', text: '1,000 mAh on Crush and 900 mAh on Cliq, both topped up over Type-C.' }
      ],
      strip: products.map((p) => ({
        label: 'Beri ' + p.name.charAt(0) + p.name.slice(1).toLowerCase(),
        href: p.name.charAt(0) + p.name.slice(1).toLowerCase() + '.dc.html',
        style: 'flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 56px; padding: 0 34px; border-radius: 999px; font-size: 17px; font-weight: 700; white-space: nowrap; text-decoration: none; color: #FFFFFF'
      })),
    };
  }
}
</script>
<script src="assets/js/beri-runtime.js"></script>
</body>
