html{scroll-behavior:smooth}
body{margin:0;background:#F6F3EE}
a{color:#111113}a:hover{color:#7A5F14}
.rv-ready [data-reveal]{opacity:0;transition:opacity .9s var(--ease),transform .9s var(--ease)}

.rv-ready [data-reveal="right"]{transform:translateX(64px)}

.nav-dd{position:relative}
.nav-menu{position:absolute;top:100%;left:-24px;padding-top:18px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.nav-dd:hover .nav-menu,.nav-dd:focus-within .nav-menu{opacity:1;visibility:visible;transform:none}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;color:#111113;text-decoration:none}
.nav-item:hover{background:#F6F3EE;color:#111113}
.strip-link{transition:background .3s ease,color .3s ease;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.strip-link:hover{background:rgba(255,255,255,.2)}
.wf-field{height:56px;padding:0 18px;border-radius:14px;border:1.5px solid #DDD6CA;background:#F6F3EE;color:#111113;font:inherit;font-size:16px;width:100%;box-sizing:border-box}
.wf-field:focus{outline:3px solid #D8C8FF;outline-offset:2px;border-color:#3B1478}
textarea.wf-field{height:140px;padding:14px 18px;resize:vertical}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv-ready [data-reveal]{opacity:1;transform:none;transition:none}}
</style>

      { title: 'Full lineup', text: 'Stock BERI Crush, Cliq and Cirql, with every flavor from one supplier.' },

      { title: 'Dedicated support', text: 'A wholesale contact for orders, restocks and questions. [Confirm.]' }
    ];
    const lineup = [
      { name: 'CLIQ', href: 'Cliq.dc.html', color: '#0F7A42', img: 'assets/blob/38e90c83b18e5f9b193d4e2806393e55.webp', imgAlt: 'BERI Cliq device in Blue Rancher', line: 'Up to 50,000 puffs · 18 mL refillable pod · 20 flavors' },
      { name: 'CRUSH', href: 'Crush.dc.html', color: '#C81E64', img: 'assets/blob/0cd95d0e72d332cb0c13ffe953a14a5f.webp', imgAlt: 'BERI Crush device in green with HD screen', line: 'Up to 50,000 puffs · 20 mL · 40W Crush Mode · 32 flavors' },

    ];
    return {
      navStyle: 'transition: background 0.4s ease, border-color 0.4s ease, backdrop-filter 0.4s ease; ' + (this.state.scrolled

        : 'background: rgba(246,243,238,0); border-bottom: 1px solid rgba(17,17,19,0)'),
      yes: true,
      sent: this.state.sent,
      notSent: !this.state.sent,
      submit: (e) => {
        e.preventDefault();
        this.setState({ sent: true });
      },
      reset: () => this.setState({ sent: false }),
      perks: perks.map((k, i) => ({
